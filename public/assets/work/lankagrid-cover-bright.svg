<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="LankaGrid Forecaster cover: power pylon with flowing energy and a forecast chart" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.t{font-family:"Segoe UI",Helvetica,Arial,sans-serif;fill:#14142b}
.flow{stroke-dasharray:3 16;animation:flow 1.2s linear infinite}
.flowr{stroke-dasharray:3 16;animation:flow 1.2s linear infinite reverse}
.sun{transform-origin:1020px 170px;animation:pulse 3s ease-in-out infinite}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3s .5s ease-out forwards}
.fc{stroke-dasharray:6 6;opacity:0;animation:show .6s 3.4s forwards}
.bolt{animation:blink 2.4s steps(1) infinite}
@keyframes flow{to{stroke-dashoffset:-19}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes show{to{opacity:1}}
@keyframes blink{0%,60%{opacity:1}70%,80%{opacity:.25}90%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}.fc{opacity:1}}
</style>
<defs><clipPath id="p"><rect x="650" y="50" width="500" height="530" rx="36"/></clipPath></defs>
<rect width="1200" height="630" fill="#ffe14d"/>
