<text class="t" x="20" y="34" font-size="16" font-weight="600">Grid demand forecast</text>
<text class="t" x="20" y="72" font-size="34" font-weight="800" style="fill:#ff3d7f">R² 0.9991</text>
<path class="draw" pathLength="1" fill="none" stroke="#2e5bff" stroke-width="5" stroke-linecap="round" d="M20 152C50 154 70 150 90 136C110 122 130 108 160 106C190 104 205 96 225 90C240 86 250 110 252 130"/>
