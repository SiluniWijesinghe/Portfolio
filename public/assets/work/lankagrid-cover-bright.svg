<text class="t" x="116" y="89" font-size="19" font-weight="600">Machine learning for energy</text>
<text class="t" x="68" y="195" font-size="88" font-weight="800" letter-spacing="-3">LankaGrid</text>
<text class="t" x="68" y="282" font-size="88" font-weight="800" letter-spacing="-3">Forecaster</text>
<text class="t" x="72" y="340" font-size="25">Forecasting Sri Lanka's national grid demand</text>
<text class="t" x="72" y="374" font-size="25">every 15 minutes, with clear explanations</text>
